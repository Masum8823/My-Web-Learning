<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figure with caption</title>
</head>
<body>
    <h1 style="text-align: center;">Figure with Caption</h1><hr>
    <figure>
        <img src="Apple.webp" alt="apple" height="200px" width="300px">
        <figcaption>Fig1 : This is the figure of an Apple</figcaption>
    </figure>
</body>
</html>
