<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form in HTML</title>
</head>
<body>

    <h2>Registration Form</h2>
    
    <form>
            
            <div>
                <label for="fullname">FullName: </label>
                <input type="text" name="fullname" id="fullname">
            </div><br>

            <div>
                <label for="email">Email: </label>
                <input type="email" name="email" id="email"><br><br>
            </div>

            <div>
                <label for="password">Password: </label>
                <input type="password" name="password" id="password"><br><br>
            </div>

            <div>
                <label for="dob"> Date of Birth: </label>
                <input type="date" name="dob" id="dob"><br><br>
            </div>

            <div>
                <label for="photo"> Choose you Photo: </label>
                <input type="file" name="photo" id="photo"><br><br>
            </div>

            <div>
                <label for="gender"> Gender: </label>
                <input type="radio" name="gender" id="gender" value="Male"> Male
                <input type="radio" name="gender" id="gender" value="female"> Female
                <input type="radio" name="gender" id="gender" value="Others"> Others
            </div><br>

            <div>
                <label for="religion"> Religion: </label>
                <input type="checkbox" name="religion" id="religion" value="Muslim"> Islam
                <input type="checkbox" name="religion" id="religion" value="Hindu"> Hindu
                <input type="checkbox" name="religion" id="religion" value="Others"> Others
            </div>

            
            
    </form>

</body>
</html>
