<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Class in CSS</title>
    <style>
        .center{
            text-align: center;
            color: aquamarine;
        }

        .para1{
            background-color: red;
            font-size: 22px;
        }

        .heading1{
            color: aqua;
            background-color: black;
        }
    </style>
</head>
<body>
    <h1 class="heading1 center">Multiple Class inside the same tag</h1>
    <p class="center para1">This is paragraph 1.</p>
</body>
</html>
