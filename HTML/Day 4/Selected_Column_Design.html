<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Column Designing inside the Table</title>
</head>
<body>
    <header>
        <h1>HTML Table</h1>
    </header>

    <main>
        <table>
            <caption>Student Details</caption>
                <colgroup>
                <col span="2" style="background-color: bisque;">
                </colgroup>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>CGPA</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr>
                            <th>1349</th>
                            <td>Masum</td>
                            <td>3.90</td>
                        </tr>

                        <tr>
                            <th>1350</th>
                            <td>Ritu</td>
                            <td>3.90</td>
                        </tr>

                </tbody>
        </table>
    </main>
    
    
</body>
</html>
