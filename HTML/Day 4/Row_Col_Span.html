<!DOCTYPE html>
    <html lang="en">
        <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Row Span and Column Span inside the Table</title>
            <style>
                table{
                    border: 2px solid black;
                    border-collapse: collapse;
                }
                td,th{
                    border: 2px solid black;
                    padding: 20px
                }
            </style>

        </head>
    
        <body>
            <table>
                <thead>
                    <tr>
                        <th> ID</th>
                        <th>Name </th>
                        <th colspan="2">Phone </th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>1350</td>
                        <td>Ritu</td>
                        <td>017</td>
                        <td rowspan="2">018</td>
                    </tr>
                    <tr>
                        <td>1349</td>
                        <td>Masum</td>
                        <td>017</td>
                    </tr>
                    <tr>
                        <td>1351</td>
                        <td>Taskira</td>
                        <td>012</td>
                        <td>019</td>
                    </tr>
                </tbody>
            </table>
        </body>
    </html>
