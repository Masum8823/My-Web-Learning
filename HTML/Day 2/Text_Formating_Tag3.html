<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Description" content="HTML Text Formatting Practice">
    <title>Text Formatting Tag 3</title>
</head>
<body>

    <h3><u>HTML Practice Session</u></h3> <p>

    <b>Learning Web Development</b> <p>

    <i>Front-End Development</i> <p>

    <u>Back-End Basics</u> <p>

    <b><i><u>Full Stack Journey</u></i></b> <p>

    H<sub>2</sub>O is water <p>

    (a + b)<sup>2</sup> = a<sup>2</sup> + 2ab + b<sup>2</sup> <p>

    My name is <mark>Masum</mark> <p>

    <small>This is small text example</small> <p>

    <del>This line is removed</del> <p>

    <ins>This is newly added text</ins>

</body>
</html>
