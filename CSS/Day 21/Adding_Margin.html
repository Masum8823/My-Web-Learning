<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin Adding in CSS</title>
    <style>
        #section1{
            margin : 10px 20px 30px 40px; /*Top, Right, Bottom, Left*/
            background-color: red;
            width: 220px;
        }

        #section2{
            margin-top: 20px;
            margin-left: 30px;
            width: 220px;
            background-color: green;
        }
    </style>
</head>
<body>

    <div id="section1">
        <h1>Bangladesh</h1>
    </div>

    <div id="section2">
        <h1>India</h1>
    </div>
    
</body>
</html>
