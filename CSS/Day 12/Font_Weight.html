<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Weight in CSS</title>

        <style>

            #pid{
                font-weight: bold;
                color: red;
                font-size: 30px;
                background-color: beige;
            }

            h1{
                text-align: center;
            }

        </style>

</head>

<body>

    <h1>Hello There!!</h1>

        <p id="pid">This is the paragraph under bold line</p>

        <p>This is the normal Paragraph</p>
    
</body>
</html>
