<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Decoration (Underline) in CSS</title>
    
    <style>
        .decoration{
            text-decoration: underline;
        }
    </style>

</head>

<body>

    <div>
        <h1 class="decoration">Hello There!!!</h1>
        <p>This is Paragraph 1.</p>
    </div>
    
    <div>
        <h1>Hello There!!!</h1>
        <p>This is Paragraph 2.</p>
    </div>
    
</body>
</html>
