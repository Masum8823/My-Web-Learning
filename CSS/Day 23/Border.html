<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border in CSS</title>

    <style>
        #id1{
            border: 5px green solid; /*more border style from w3 school*/
            width: 240px;
            border-radius: 10px;
        }

        #id2{
            border-left: 5px green solid ;
            border-right: 10px black dotted;
            border-bottom: 5px aqua solid;
            width: 240px;
        }


    </style>
</head>
<body>

    <h1 id="id1">Bangladesh</h1>

    <h1 id="id2">Bangladesh</h1>
    
</body>
</html>
