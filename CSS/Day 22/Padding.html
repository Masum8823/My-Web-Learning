<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding in CSS</title>

    <style>
        #id1{
            background-color: black;
            color: aqua;
            padding: 20px; /*total size 200 + (20+20 keft right mixed kroe)*/
            width: 200px;
            margin-bottom: 10px;
        }

        #id2{
            background-color: red;
            color: white;
            padding: 10px; /*left right bottom up sob jiagai 10px kore kore bere jabe*/
            width: 200px;
        }
    </style>
</head>
<body>

    <div id="id1">
        <h1>Bangladesh</h1>
    </div>

    <div id="id2">
        <h1>India</h1>
    </div>
    
</body>
</html>
