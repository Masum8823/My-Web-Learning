<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Style</title>
    <style>
        .love{
            color: red;
            font-size: 5rem;
        }
    </style>
</head>
<body>
    <h1>Hello There!!</h1>

    <p>I <span class="love">❤</span> Bangladesh</p>
    <p>I Love <span class="love">🦋</span> </p>
    
</body>
</html>
