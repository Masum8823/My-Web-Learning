<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text_Decoration(Line-Spacing) in CSS</title>

    <style>
        .decoration{
            letter-spacing: 5px;
        }
    </style>

</head>

<body>

    <h1 class="decoration">Hello From Header 1</h1>

    <h1>Hello From Header 2</h1>
    
</body>
</html>
